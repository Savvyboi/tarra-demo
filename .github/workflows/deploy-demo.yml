name: Deploy tarra Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

env:
  TZ: 'Europe/Helsinki'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Sync static JSON-LD feeds across all 28 cities
        run: npm run sync-feeds

      - name: Run regression and 28-city feed integrity tests (Europe/Helsinki)
        run: npm test

      - name: Run regression tests under UTC and US Eastern time zones
        run: |
          TZ=UTC npm test
          TZ=America/New_York npm test

      - name: Build production bundle for GitHub Pages
        env:
          VITE_BASE_PATH: './'
        run: npm run build

      # Browser smoke tests against the production build (map actually loads, flyer
      # Details survives the clock tick, mobile layout has no overlaps). Skipped on the
      # scheduled feed refresh, where the code has not changed.
      - name: Install Playwright Chromium
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        if: github.event_name != 'schedule'
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
